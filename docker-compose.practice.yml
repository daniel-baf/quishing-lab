# Intentionally vulnerable practice stack used by the QR arsenal in the
# dashboard (theme proxy + bait app + XSS session-theft target + guided
# lessons).
#
# WebGoat is NEVER exposed to the Internet (localhost bindings only). The
# Juice Shop "store" (theme-proxy on port 4000) MAY be exposed through the
# `tunnel-store` Quick Tunnel in docker-compose.yml for off-LAN demos — a
# deliberate exception documented in SECURITY.md: fake accounts only, tear it
# down after the demo.

name: quishing-lab-practice

services:
  # Reverse proxy in front of Juice Shop that injects the fictitious
  # "Empresa Ficticia" theme. Takes over host port 4000 so the QR origin stays
  # the same (sessionStorage is per-origin — changing it would break /api/loot).
  theme-proxy:
    image: nginx:1.27-alpine
    ports:
      - "4000:80"
    volumes:
      - ./infra/theme-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/theme-proxy/public:/usr/share/nginx/theme:ro
    depends_on:
      - juice-shop
    restart: unless-stopped

  # Bait app + session-theft target. No longer published to the host; only
  # reachable from the theme-proxy container.
  juice-shop:
    image: bkimminich/juice-shop:latest
    expose:
      - "3000"
    restart: unless-stopped

  # Guided OWASP course + WebWolf. Unchanged.
  webgoat:
    image: webgoat/webgoat:latest
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    healthcheck:
      disable: true
    restart: unless-stopped
