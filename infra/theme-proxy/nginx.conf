worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  demo  '$remote_addr - [$time_local] "$request" $status';
  access_log  /dev/stdout  demo;
  error_log   /dev/stderr   warn;

  gzip off;

  server {
    listen 80;
    server_name _;

    location /__theme/ {
      alias /usr/share/nginx/theme/;
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }

    location = /ngsw-worker.js { return 404; }

    location / {
      proxy_pass         http://juice-shop:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";

      proxy_set_header   Accept-Encoding   "";

      proxy_hide_header  Content-Security-Policy;
      proxy_hide_header  Content-Security-Policy-Report-Only;
      proxy_hide_header  X-Content-Security-Policy;

      sub_filter_once    on;
      sub_filter         '</head>' '<link rel="stylesheet" href="/__theme/custom-theme.css"><script src="/__theme/custom-theme.js" defer></script></head>';
    }
  }
}