services:
  app:
    build: .
    env_file:
      - .env
    environment:
      # The LAN IP cannot be autodetected inside the container (it only sees
      # the Docker network); the Makefile detects it on the host and passes
      # it in here.
      - LAN_IP=${LAN_IP:-}
      # Points at the db service below; override in .env if you use an
      # external database. Unset/empty keeps the loot in memory only.
      # The password lives in .env (see .env.example), not in this file.
      - DATABASE_URL=${DATABASE_URL:-}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    # Reads POSTGRES_PASSWORD from .env (see .env.example); it is never
    # stored in this file.
    env_file:
      - .env
    environment:
      POSTGRES_USER: quishing
      POSTGRES_DB: quishing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quishing -d quishing"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # Quick Tunnel for the "store" (theme-proxy → Juice Shop), for demos where
  # the victim's phone is NOT on the LAN. Deliberate exception to the old
  # LAN-only rule, documented in SECURITY.md: the store is intentionally
  # vulnerable and anyone with the URL gets in — use fake accounts and tear
  # the tunnel down after the demo (`make down`).
  # The store lives in docker-compose.practice.yml (its own network), so this
  # tunnel reaches it through the host's published port 4000.
  tunnel-store:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://host.docker.internal:4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
