services:
  app:
    build: .
    env_file:
      - .env
    environment:
      # La IP LAN no se puede autodetectar dentro del contenedor (solo ve la
      # red de Docker); la detecta el Makefile en el host y la pasa aquí.
      - LAN_IP=${LAN_IP:-}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # App intencionadamente vulnerable (víctima de práctica para la demo).
  # NUNCA exponer por el túnel: solo LAN/localhost.
  # Sin healthcheck: la imagen v20+ no incluye node/sh para sondear dentro
  # del contenedor; el servicio se verifica desde el host con `make health`.
  juice-shop:
    image: bkimminich/juice-shop:latest
    ports:
      - "4000:3000"
    restart: unless-stopped

  # Curso guiado OWASP + WebWolf (request bin para exfiltración).
  # Intencionadamente vulnerable: solo localhost.
  # Desactivamos el healthcheck de la imagen upstream: usa curl, que la
  # imagen no trae, y marcaría el contenedor "unhealthy" permanentemente.
  webgoat:
    image: webgoat/webgoat:latest
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    healthcheck:
      disable: true
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
