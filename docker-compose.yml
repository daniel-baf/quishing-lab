services:
  app:
    build: .
    env_file:
      - .env
    environment:
      # The LAN IP cannot be autodetected inside the container (it only sees
      # the Docker network); the Makefile detects it on the host and passes
      # it in here.
      - LAN_IP=${LAN_IP:-}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
